services:
  - type: web
    name: wealify-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Wealify Financial Assistant
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: "https://wealify.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./wealify.db"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_API_KEY
        sync: false
      - key: ML_ROOT
        value: /app/ml
