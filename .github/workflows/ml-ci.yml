name: ML pipeline

on:
  push:
    paths: ["ml/**", "backend/src/services/subscription_model.py",
            "backend/src/api/subscriptions.py", ".github/workflows/ml-ci.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r ml/requirements.txt pytest
      - run: python -m pytest ml/tests -q

  train-and-gate:
    name: Train + quality gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r ml/requirements.txt

      - name: Leakage audit
        run: python -m ml.cli audit --out leakage_report.json

      # `train` tra ve exit code != 0 khi truot cong chat luong (config.yaml: gates)
      - name: Train + gate
        run: python -m ml.cli train

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-registry
          path: |
            ml/registry/
            leakage_report.json
          retention-days: 30
