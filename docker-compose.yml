version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./wealify.db
      - DEBUG=true
      # Serve ML checkpoints from the mounted volume below rather than the
      # in-source default (backend/src/modules/ml/artifacts).
      - ML_ARTIFACT_DIR=/app/checkpoints
    volumes:
      - ./backend:/app
      # Read-only: inference must never mutate a checkpoint.
      - ./checkpoints:/app/checkpoints:ro

    command: uvicorn src.api.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
