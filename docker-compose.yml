version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./wealify.db
      - DEBUG=true
    volumes:
      - ./backend:/app
    command: uvicorn src.api.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # Pipeline ML — chay theo lenh, khong phai service chay lien tuc.
  #   docker compose run --rm ml train --promote
  #   docker compose run --rm ml evaluate --data subscription_labels.csv
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    profiles: ["ml"]
    volumes:
      - ./ml/registry:/app/ml/registry
      - ./ml/artifacts:/app/ml/artifacts
      - ./subscription_labels.csv:/app/subscription_labels.csv:ro
    command: ["versions"]
